name: "MiniKV CI"
on:
  push:
    branches:
      - main
      - wip
  pull_request:
    branches:
      - main
      - wip

jobs:
  build:
    name: Build and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential \
          clang-format

      - name: Check formatting
        run: make format-check

      - name: Clean
        run: make clean

      - name: Compile
        run: make
